start_date: 2008-08-01T00:00:00.000
end_date: 2008-08-01T02:00:00.000
calendar: 360d # proleptic-gregorian
timestep_unit: ISO_format

debug:
  coordinates_mismatch_is_fatal: false   # warns instead of aborting

definitions:
  components:
    atm: &atm
      component: atm
      grid: icon_atmos_grid
    cleo: &cleo
      component: cleo
      grid: cleo_cartesian_grid
  interp_stacks:
    interp_stack_to_cleo_thermo: &interp_stack_to_cleo_thermo
      interpolation:
        - average:
            weighted: barycentric_coordinate
            partial_coverage: true
        - nnn:
            n: 4
            weighted: distance_weighted
            # no max_search_distance = unbounded: guarantees SOME match is always found
    interp_stack_to_cleo_winds: &interp_stack_to_cleo_winds
      interpolation:
        - rbf:
            n: 4
            rbf_kernel: gauss_kernel
        - nnn:
            n: 4
            weighted: distance_weighted
            # no max_search_distance = unbounded: guarantees SOME match is always found
    interp_stack_from_cleo_thermo: &interp_stack_from_cleo_thermo
      interpolation:
        - conservative:
            order: 1
            enforced_conservation: false
            partial_coverage: true
            normalisation: destarea
        - fixed:
            user_value: 0.0
  time_config: &time_config
    coupling_period: PT30S
  component_configs:
    atm2cleo: &atm2cleo
      <<: *time_config
      source: *atm
      target: *cleo
      src_lag: 0
      tgt_lag: 0
    cleo2atm: &cleo2atm
      <<: *time_config
      source: *cleo
      target: *atm
      src_lag: 0
      tgt_lag: 0

coupling:
# ATM -> CLEO
  - <<: [*atm2cleo, *interp_stack_to_cleo_winds]
    field:
      - src: eastward_wind_to_cleo
        tgt: eastward_wind_in
      - src: northward_wind_to_cleo
        tgt: northward_wind_in
      - src: upward_air_velocity_to_cleo
        tgt: upward_air_velocity_in
  - <<: [*atm2cleo, *interp_stack_to_cleo_thermo]
    field:
      - src: humidity_mixing_ratio_to_cleo
        tgt: humidity_mixing_ratio_in
      - src: cloud_liquid_water_mixing_ratio_to_cleo
        tgt: cloud_liquid_water_mixing_ratio_in
      - src: rain_liquid_water_mixing_ratio_to_cleo
        tgt: rain_liquid_water_mixing_ratio_in
      - src: air_pressure_to_cleo
        tgt: air_pressure_in
      - src: air_temperature_to_cleo
        tgt: air_temperature_in
