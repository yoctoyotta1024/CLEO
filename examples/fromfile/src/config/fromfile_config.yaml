# File Description:
# Configuration file for contol example of 3D time varying thermodyanamics read from a file.
# Note: The initial superdroplets data read from file "initsupers_filename" can be made with
# CLEO's cleopy module (see Python script "create_initsuperdropsbinary_script.py" for example of usage).
# Likewise the "grid_filename" can be made using cleopy (see "create_gbxboundariesbinary_script.py"),
# and so can the thermodynamics files when using coupled thermodynamics "fromfile".
#

### Initialization Parameters for fromfile_inputfiles.py ###
python_inputfiles:
  zgrid_max: 1500                              # domain size in z [m]
  xgrid_max: 1500                              # domain size in x [m]
  ygrid_max: 300                               # domain size in y [m]
  zgrid_ngbxs: 25                              # z direction ngbxs <- note(!) z_ * x_ * y_ngbxs == ngbxs (see below)
  xgrid_ngbxs: 30                              # x direction ngbxs <- note(!) z_ * x_ * y_ngbxs == ngbxs (see below)
  ygrid_ngbxs: 3                               # y direction ngbxs <- note(!) z_ * x_ * y_ngbxs == ngbxs (see below)
  sd_zlim: 1000                                # max z coord of initial superdroplets
  nsupers_pergbx: 2                            # number of SDs per gridbox below sd_zlim <- note(!) must be consistent with maxnsupers (see below)
  monor: 1e-6                                  # all SDs have this same radius [m]
  dryr_sf: 1.0                                 # scale factor for dry radii [m]
  numconc: 5e8                                 # total no. conc of real droplets [m^-3]
  thermo_PRESSz0: 101500                       # settings for thermodynamics profiles [Pa]
  thermo_TEMPz0: 300                           # [K]
  thermo_qvapz0: 0.05                          # [Kg/Kg]
  thermo_qcondz0: 0.001                        # [Kg/Kg]
  thermo_WMAX: 1.5                             # [m/s]
  thermo_Zlength: 1500                         # [m]
  thermo_Xlength: 1500                         # [m]
  thermo_VMAX: 1.0                             # [m/s]
  thermo_Ylength: 300                          # [m]

### Kokkos Initialization Parameters ###
kokkos_settings:
  num_threads: 16                                          # number of threads for host parallel backend

### SDM Runtime Parameters ###
domain:
  nspacedims : 3                                          # no. of spatial dimensions to model
  ngbxs : 2250                                            # total number of Gbxs
  maxnsupers: 2880                                        # maximum number of SDs

timesteps:
  CONDTSTEP : 2                                           # time between SD condensation [s]
  COLLTSTEP : 2                                           # time between SD collision [s]
  MOTIONTSTEP : 3                                         # time between SDM motion [s]
  COUPLTSTEP : 100                                        # time between dynamic couplings [s]
  OBSTSTEP : 100                                          # time between SDM observations [s]
  T_END : 10800                                           # time span of integration from 0s to T_END [s]

### Initialisation Parameters ###
inputfiles:
  constants_filename : ./libs/cleoconstants.hpp          # name of file for values of physical constants
  grid_filename : ./build/share/fromfile_dimlessGBxboundaries.dat   # binary filename for initialisation of GBxs / GbxMaps

initsupers:
  type: frombinary                                        # type of initialisation of super-droplets
  initsupers_filename : ./build/share/fromfile_dimlessSDsinit.dat   # binary filename for initialisation of SDs

### Output Parameters ###
outputdata:
  setup_filename : ./build/bin/fromfile_setup.txt                   # .txt filename to copy configuration to
  zarrbasedir : ./build/bin/fromfile_sol.zarr                       # zarr store base directory
  maxchunk : 2500000                                      # maximum no. of elements in chunks of zarr store array

### Coupled Dynamics Parameters ###
coupled_dynamics:
  type : fromfile                                         # type of coupled dynamics to configure
  press : ./build/share/fromfile_dimlessthermo_press.dat            # binary filename for pressure
  temp : ./build/share/fromfile_dimlessthermo_temp.dat              # binary filename for temperature
  qvap : ./build/share/fromfile_dimlessthermo_qvap.dat              # binary filename for vapour mixing ratio
  qcond : ./build/share/fromfile_dimlessthermo_qcond.dat            # binary filename for liquid mixing ratio
  wvel : ./build/share/fromfile_dimlessthermo_wvel.dat              # binary filename for vertical (coord3) velocity
  uvel : ./build/share/fromfile_dimlessthermo_uvel.dat              # binary filename for eastwards (coord1) velocity
  vvel : ./build/share/fromfile_dimlessthermo_vvel.dat              # binary filename for eastwards (coord1) velocity
