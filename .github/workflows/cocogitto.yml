name: cocogitto (and release)

on: [push]

jobs:
  cog_check_job:
    runs-on: ubuntu-latest
    name: check commits with cocogitto
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Conventional commits compliance check
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          command: check
          args: --from-latest-tag
          git-user: 'yoctoyotta1024'
          git-user-email: 'yoctoyotta1024@yahoo.com'

  test_cleopy_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      - name: check uv.lock file against pyproject.toml
        run: |
          uv lock --check

      - name: build and test cleopy
        run: |
          uv build
          uv run pytest tests/

      # Check that basic features work and we didn't miss to include crucial files
      - name: pytests (wheel)
        run: uv run --isolated --no-project -p 3.13 --with dist/*.whl tests/test_publish.py

      - name: pytests (source distribution)
        run: uv run --isolated --no-project -p 3.13 --with dist/*.tar.gz tests/test_publish.py

  release:
    needs: ["cog_check_job", "test_cleopy_build"]
    # Only release new version when merging into `origin/main` of yoctoyotta1024's CLEO repo.`
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'yoctoyotta1024/CLEO'"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: Perform semantic versioning release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: semver release with cocogitto
        uses: cocogitto/cocogitto-action@v4.2.0
        id: release
        with:
          command: bump
          args: --auto
          git-user: 'yoctoyotta1024'
          git-user-email: 'yoctoyotta1024@yahoo.com'

      - name: Print version for release
        run: |
          echo "current Cleo version: ${{ steps.release.outputs.version }}, updated in CITATION.cff"

      - name: Generate Changelog
        run: cog changelog --at ${{ steps.release.outputs.version }} -t remote > GITHUB_CHANGELOG.md

      - name: Upload github release
        uses: softprops/action-gh-release@v3
        with:
          body_path: GITHUB_CHANGELOG.md
          tag_name: ${{ steps.release.outputs.version }}
          files: |
            CITATION.cff
